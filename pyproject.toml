[project]
name = "ds-bookstore"
version = "0.1.0"
description = "ds course dummy bookstore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpc-stubs>=1.53.0.6",
    "grpcio-tools>=1.78.0",
    "mypy-protobuf>=5.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-levenshtein>=0.27.3",
    "requests>=2.32.5",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
